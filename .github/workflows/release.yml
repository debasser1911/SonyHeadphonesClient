name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1). Leave empty to build artifact only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/app

      - name: Run tests
        run: cargo test --manifest-path rust/app/Cargo.toml --locked

      - name: Build release binary
        run: cargo build --manifest-path rust/app/Cargo.toml --release --locked

      - name: Package release archive
        shell: pwsh
        run: |
          $stage = "dist/sony-headphones-client-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "rust/app/target/release/sony-headphones-client.exe" "$stage/"
          Copy-Item "LICENSE" "$stage/"
          Copy-Item "README.md" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/sony-headphones-client-windows-x86_64.zip" -Force
          $hash = (Get-FileHash "dist/sony-headphones-client-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  sony-headphones-client-windows-x86_64.zip" | Out-File -FilePath "dist/sony-headphones-client-windows-x86_64.zip.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sony-headphones-client-windows-x86_64
          path: |
            dist/sony-headphones-client-windows-x86_64.zip
            dist/sony-headphones-client-windows-x86_64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/sony-headphones-client-windows-x86_64.zip
            dist/sony-headphones-client-windows-x86_64.zip.sha256
